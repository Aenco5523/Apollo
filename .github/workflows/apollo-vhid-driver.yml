name: Build Apollo V-HID Driver

on:
  workflow_dispatch:
  push:
    branches:
      - apollo-vhid-ci
    paths:
      - 'driver/ApolloVhid/**'
      - '.github/workflows/apollo-vhid-driver.yml'

permissions:
  contents: read

jobs:
  build-driver:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore WDK and Windows SDK NuGet packages
        shell: pwsh
        run: |
          nuget restore .\driver\ApolloVhid\packages.config -PackagesDirectory .\driver\ApolloVhid\packages

      - name: Build ApolloVhid x64 Release
        shell: pwsh
        run: |
          msbuild .\driver\ApolloVhid\ApolloVhid.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /v:minimal

      - name: Collect driver package
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifact | Out-Null
          Get-ChildItem .\driver\ApolloVhid -Recurse -File |
            Where-Object { $_.Extension -in '.sys','.inf','.inx','.cat','.pdb' } |
            Copy-Item -Destination .\artifact -Force
          Get-ChildItem .\artifact -Force

      - name: Upload ApolloVhid artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ApolloVhid-x64-Release
          path: artifact/
          if-no-files-found: warn
