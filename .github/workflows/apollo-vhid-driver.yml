name: Build Apollo V-HID Driver

on:
  workflow_dispatch:
  push:
    branches:
      - apollo-vhid-ci
    paths:
      - 'driver/ApolloVhid/**'
      - '.github/workflows/apollo-vhid-driver.yml'

permissions:
  contents: read

jobs:
  build-driver:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore WDK and Windows SDK NuGet packages
        shell: pwsh
        run: |
          nuget restore .\driver\ApolloVhid\packages.config -PackagesDirectory .\driver\ApolloVhid\packages

      - name: Expose WDK NuGet tools
        shell: pwsh
        run: |
          $packages = (Resolve-Path .\driver\ApolloVhid\packages).Path
          $toolNames = @('stampinf.exe', 'infverif.exe', 'inf2cat.exe', 'signtool.exe')
          $dirs = New-Object System.Collections.Generic.HashSet[string] ([System.StringComparer]::OrdinalIgnoreCase)

          foreach ($toolName in $toolNames) {
            $matches = @(Get-ChildItem -Path $packages -Filter $toolName -Recurse -File -ErrorAction SilentlyContinue)
            if ($matches.Count -eq 0) {
              Write-Host "${toolName}: not found in restored packages"
              continue
            }

            foreach ($match in $matches) {
              Write-Host "$toolName => $($match.FullName)"
              [void]$dirs.Add($match.Directory.FullName)
            }
          }

          $stampInf = Get-ChildItem -Path $packages -Filter stampinf.exe -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Select-Object -First 1
          if (-not $stampInf) {
            throw 'x64 stampinf.exe was not found in the restored WDK NuGet package.'
          }
          $stampInf.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          $infVerifDll = Get-ChildItem -Path $packages -Filter InfVerif.dll -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Select-Object -First 1
          if (-not $infVerifDll) {
            $infVerifDll = Get-ChildItem -Path $packages -Filter InfVerif.dll -Recurse -File -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }
          if (-not $infVerifDll) {
            throw 'InfVerif.dll was not found in the restored WDK NuGet package.'
          }

          $infVerifRoot = $infVerifDll.Directory.Parent.FullName
          Write-Host "InfVerif native root => $infVerifRoot"
          "WDK_INFVERIF_ROOT=$infVerifRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          foreach ($dir in $dirs) {
            $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Locate 64-bit MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found at $vswhere"
          }

          $vsPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vsPath) {
            throw 'Visual Studio with MSBuild was not found'
          }

          $msbuild = Join-Path $vsPath 'MSBuild\Current\Bin\amd64\MSBuild.exe'
          if (-not (Test-Path $msbuild)) {
            throw "64-bit MSBuild.exe was not found at $msbuild"
          }

          "MSBUILD_EXE=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using MSBuild: $msbuild"

      - name: Build ApolloVhid x64 Release
        shell: pwsh
        run: |
          $project = (Resolve-Path .\driver\ApolloVhid\ApolloVhid.vcxproj).Path
          Get-Command stampinf.exe | Format-List Source

          Push-Location "$env:WDK_INFVERIF_ROOT"
          try {
            & "$env:MSBUILD_EXE" "$project" `
              /m `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /p:SignMode=Off `
              /v:minimal

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          finally {
            Pop-Location
          }

      - name: Collect driver package
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifact | Out-Null
          Get-ChildItem .\driver\ApolloVhid -Recurse -File |
            Where-Object {
              $_.FullName -notmatch '\\packages\\' -and
              $_.BaseName -eq 'ApolloVhid' -and
              $_.Extension -in '.sys','.inf','.cat','.pdb'
            } |
            Copy-Item -Destination .\artifact -Force
          Copy-Item .\driver\ApolloVhid\ApolloVhid.inx .\artifact\ApolloVhid.inx -Force
          Get-ChildItem .\artifact -Force

      - name: Upload ApolloVhid artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ApolloVhid-x64-Release
          path: artifact/
          if-no-files-found: error
