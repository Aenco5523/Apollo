name: Build Apollo V-HID Host

on:
  push:
    branches:
      - apollo-vhid-ci
    paths:
      - 'src/config.h'
      - 'src/config.cpp'
      - 'src/platform/windows/input.cpp'
      - 'src/platform/windows/virtual_hid.h'
      - 'src/platform/windows/viiper_hid.h'
      - 'src/platform/windows/viiper_hid.cpp'
      - 'cmake/compile_definitions/windows.cmake'
      - 'tools/apollo-vhid/ApolloVhidDevnode.cpp'
      - 'tools/apollo-vhid/*.ps1'
      - '.github/workflows/apollo-vhid-host-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Work around upstream AMF profile build regression
        shell: pwsh
        run: |
          $path = '.\src\video.cpp'
          $text = Get-Content -Raw -Path $path
          $pattern = '(?ms)      \{\r?\n        // SDR-specific options\r?\n        \{"profile"s, \[\]\(const config_t &cfg\) \{\r?\n           if \(cfg\.profile == 66\) return "baseline"s;\r?\n           if \(cfg\.profile == 77\) return "main"s;\r?\n           return "high"s;\r?\n         \}\},\r?\n      \},'
          $patched = [regex]::Replace($text, $pattern, '      {},  // SDR-specific options', 1)
          if ($patched -eq $text) {
            throw 'Expected upstream AMF profile regression block was not found; refusing an ambiguous patch.'
          }
          Set-Content -Path $path -Value $patched -NoNewline
          Write-Host 'Applied CI-only workaround for ClassicOldSong/Apollo PR #1438 build regression.'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            git
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-nlohmann_json
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure Apollo
        shell: msys2 {0}
        run: |
          node --version
          npm --version
          cmake --version
          gcc --version
          cmake -B build -G Ninja -S . -DBUILD_TESTS=OFF -DBUILD_DOCS=OFF

      - name: Build Apollo
        shell: msys2 {0}
        run: cmake --build build --parallel 2

      - name: Build V-HID devnode helper
        shell: msys2 {0}
        run: |
          g++ -std=c++20 -O2 -municode tools/apollo-vhid/ApolloVhidDevnode.cpp -o build/ApolloVhidDevnode.exe -lsetupapi
          ./build/ApolloVhidDevnode.exe --help

      - name: Package Apollo portable ZIP
        shell: msys2 {0}
        run: |
          mkdir -p package_out
          cpack -G ZIP --config ./build/CPackConfig.cmake -B ./package_out
          ls -lh ./package_out/*.zip

      - name: Build Apollo plus VIIPER complete ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $viiperUrl = 'https://github.com/Alia5/VIIPER/releases/download/dev-snapshot/viiper-windows-amd64.zip'
          $viiperExpectedSha256 = '1fe869ab0b5e181d7a98c7d489f57ec3104add65761f13bf13d9181a8943d62e'
          $viiperZip = Join-Path $PWD 'viiper-windows-amd64.zip'
          Invoke-WebRequest -Uri $viiperUrl -OutFile $viiperZip
          $viiperActualSha256 = (Get-FileHash -Algorithm SHA256 -Path $viiperZip).Hash.ToLowerInvariant()
          if ($viiperActualSha256 -ne $viiperExpectedSha256) {
            throw "VIIPER SHA-256 mismatch: $viiperActualSha256"
          }

          Remove-Item -Recurse -Force .\complete_bundle, .\viiper_dist, .\complete_out -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path .\complete_bundle, .\viiper_dist, .\complete_out | Out-Null
          Expand-Archive -Path $viiperZip -DestinationPath .\viiper_dist -Force

          $apolloZip = Get-ChildItem .\package_out -Filter *.zip | Select-Object -First 1
          if (-not $apolloZip) { throw 'Apollo portable ZIP was not found.' }
          Expand-Archive -Path $apolloZip.FullName -DestinationPath .\complete_bundle -Force

          New-Item -ItemType Directory -Force -Path .\complete_bundle\VIIPER | Out-Null
          Copy-Item .\viiper_dist\* .\complete_bundle\VIIPER\ -Recurse -Force

          $viiperExe = Get-ChildItem .\complete_bundle\VIIPER -Recurse -File -Filter 'viiper*.exe' | Select-Object -First 1
          if (-not $viiperExe) { throw 'VIIPER executable was not found after extraction.' }
          if (-not (Test-Path .\complete_bundle\VIIPER\viiper.exe)) {
            Copy-Item $viiperExe.FullName .\complete_bundle\VIIPER\viiper.exe -Force
          }

          New-Item -ItemType Directory -Force -Path .\complete_bundle\Apollo\config | Out-Null
          Set-Content -Path .\complete_bundle\Apollo\config\sunshine.conf -Encoding ascii -Value 'virtual_hid = true'

          $launcher = @'
          @echo off
          setlocal
          set "ROOT=%~dp0"
          set "VIIPER=%ROOT%VIIPER\viiper.exe"
          set "APOLLO=%ROOT%Apollo\sunshine.exe"
          if not exist "%VIIPER%" (
            echo [ERROR] VIIPER executable not found.
            pause
            exit /b 1
          )
          if not exist "%APOLLO%" (
            echo [ERROR] Apollo executable not found.
            pause
            exit /b 1
          )
          start "VIIPER" "%VIIPER%" server
          powershell -NoProfile -Command "$ok=$false; for($i=0; $i -lt 30; $i++){ try { $c=New-Object Net.Sockets.TcpClient; $c.Connect('127.0.0.1',3242); $c.Close(); $ok=$true; break } catch { Start-Sleep -Milliseconds 200 } }; if(-not $ok){ exit 1 }"
          if errorlevel 1 (
            echo [ERROR] VIIPER API did not open on 127.0.0.1:3242.
            echo Check that VIIPER started successfully and that a normally signed usbip-win2 installation is present.
            pause
            exit /b 2
          )
          pushd "%ROOT%Apollo"
          "%APOLLO%"
          popd
          endlocal
          '@
          Set-Content -Path .\complete_bundle\Start-Apollo-VIIPER.cmd -Encoding ascii -Value $launcher

          $readme = @'
          Apollo + VIIPER test bundle

          1. This ZIP already contains the VIIPER Windows x64 runtime.
          2. A normally signed usbip-win2 installation is still required on Windows.
          3. Do not disable Windows driver-signing or other security protections.
          4. Double-click Start-Apollo-VIIPER.cmd.
          5. Apollo config in this fresh bundle contains: virtual_hid = true

          VIIPER source/release: https://github.com/Alia5/VIIPER
          Bundled VIIPER release SHA-256:
          1fe869ab0b5e181d7a98c7d489f57ec3104add65761f13bf13d9181a8943d62e
          '@
          Set-Content -Path .\complete_bundle\README_APOLLO_VIIPER.txt -Encoding utf8 -Value $readme

          Compress-Archive -Path .\complete_bundle\* -DestinationPath .\complete_out\Apollo-VIIPER-Complete-Windows-x64.zip -CompressionLevel Optimal -Force
          Get-FileHash -Algorithm SHA256 .\complete_out\Apollo-VIIPER-Complete-Windows-x64.zip
          Get-ChildItem .\complete_out

      - name: Collect V-HID test tools
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\tools_artifact | Out-Null
          Copy-Item .\build\ApolloVhidDevnode.exe .\tools_artifact\ApolloVhidDevnode.exe -Force
          Copy-Item .\tools\apollo-vhid\Install-ApolloVhid.ps1 .\tools_artifact\Install-ApolloVhid.ps1 -Force
          Copy-Item .\tools\apollo-vhid\Remove-ApolloVhidDevice.ps1 .\tools_artifact\Remove-ApolloVhidDevice.ps1 -Force
          Copy-Item .\tools\apollo-vhid\Start-ApolloVhidPortable.ps1 .\tools_artifact\Start-ApolloVhidPortable.ps1 -Force
          Copy-Item .\tools\apollo-vhid\README_SETUP_KO.md .\tools_artifact\README_SETUP_KO.md -Force
          Get-ChildItem .\tools_artifact -Force

      - name: Collect Windows binaries
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifact | Out-Null
          Get-ChildItem .\build -Recurse -File -Filter *.exe |
            Where-Object { $_.FullName -notmatch '\\_deps\\' -and $_.FullName -notmatch '\\CMakeFiles\\' } |
            Copy-Item -Destination .\artifact -Force
          Get-ChildItem .\artifact -Force

      - name: Upload Apollo plus VIIPER complete artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-VIIPER-Complete-Windows-x64
          path: complete_out/Apollo-VIIPER-Complete-Windows-x64.zip
          if-no-files-found: error

      - name: Upload Apollo portable artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-VHID-Portable-Windows-x64
          path: package_out/*.zip
          if-no-files-found: error

      - name: Upload Apollo V-HID tools
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-VHID-Tools-Windows-x64
          path: tools_artifact/
          if-no-files-found: error

      - name: Upload Apollo host binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-VHID-Host-Windows-x64
          path: artifact/
          if-no-files-found: error
