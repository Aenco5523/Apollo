name: Build Apollo VIIPER Installer

on:
  workflow_run:
    workflows:
      - Build Apollo V-HID Host
    types:
      - completed
    branches:
      - apollo-vhid-ci
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build-installer:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-2025

    steps:
      - name: Checkout installer sources
        uses: actions/checkout@v4
        with:
          ref: apollo-vhid-ci
          fetch-depth: 1

      - name: Resolve Apollo bundle run
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.event_name }}' -eq 'workflow_run') {
            $runId = '${{ github.event.workflow_run.id }}'
          } else {
            $run = gh run list --repo '${{ github.repository }}' --workflow 'apollo-vhid-host-build.yml' --branch 'apollo-vhid-ci' --status success --limit 1 --json databaseId | ConvertFrom-Json
            if (-not $run -or $run.Count -eq 0) { throw 'No successful Apollo V-HID host build was found.' }
            $runId = [string]$run[0].databaseId
          }
          "run_id=$runId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Using Apollo bundle from run $runId"

      - name: Download complete Apollo VIIPER bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .\source_artifact | Out-Null
          gh run download '${{ steps.source.outputs.run_id }}' --repo '${{ github.repository }}' --name 'Apollo-VIIPER-Complete-Windows-x64' --dir .\source_artifact
          $zip = Get-ChildItem .\source_artifact -Recurse -File -Filter 'Apollo-VIIPER-Complete-Windows-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Complete Apollo VIIPER ZIP was not found in the workflow artifact.' }
          Remove-Item -Recurse -Force .\installer_payload -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path .\installer_payload | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath .\installer_payload -Force
          if (-not (Test-Path .\installer_payload\Apollo\sunshine.exe)) { throw 'Apollo sunshine.exe missing from installer payload.' }
          if (-not (Test-Path .\installer_payload\VIIPER\viiper.exe)) { throw 'VIIPER executable missing from installer payload.' }

      - name: Build background launcher with MSVC x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found' }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ x64 tools not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw 'vcvars64.bat not found' }

          $cmd = '"' + $vcvars + '" && cl /nologo /std:c++20 /EHsc /O2 /MT /DUNICODE /D_UNICODE tools\apollo-vhid\ApolloViiperLauncher.cpp /link /SUBSYSTEM:WINDOWS ws2_32.lib /OUT:installer_payload\ApolloVIIPERLauncher.exe'
          cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Launcher build failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path .\installer_payload\ApolloVIIPERLauncher.exe)) { throw 'Launcher EXE was not produced.' }
          Get-FileHash -Algorithm SHA256 .\installer_payload\ApolloVIIPERLauncher.exe

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed with exit code $LASTEXITCODE" }

      - name: Build installer EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force .\installer_out -ErrorAction SilentlyContinue
          $iscc = '${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe'
          $iscc = [Environment]::ExpandEnvironmentVariables($iscc)
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found after installing Inno Setup.' }
          & $iscc '.\tools\apollo-vhid\ApolloVIIPER.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $setup = Get-Item .\installer_out\Apollo-VIIPER-Setup.exe
          $hash = Get-FileHash -Algorithm SHA256 $setup.FullName
          Write-Host "Installer: $($setup.FullName)"
          Write-Host "SHA256: $($hash.Hash)"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-VIIPER-Installer-Windows-x64
          path: installer_out/Apollo-VIIPER-Setup.exe
          if-no-files-found: error
